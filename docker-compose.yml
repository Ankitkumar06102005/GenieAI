version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://contexta_user:contexta_password@postgres:5432/contexta_db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CHROMA_PATH=/app/chroma_db
    depends_on:
      - postgres
      - chromadb

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: contexta_user
      POSTGRES_PASSWORD: contexta_password
      POSTGRES_DB: contexta_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

volumes:
  postgres_data:
  chroma_data:
